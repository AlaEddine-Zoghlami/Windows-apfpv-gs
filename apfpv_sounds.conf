# apfpv_sounds.conf — voice alerts for the APFPV ground station.
#
# MODEL (ported from OpenTX, radio/src/functions.cpp + audio.cpp)
#   A table of rows. Each row pairs a CONDITION with an ANNOUNCEMENT.
#   Announcements are CONCATENATED from small clips, exactly as OpenTX builds
#   speech ("battery" + "thirty" + "percent"), and are played through a queue so
#   two events never talk over each other.
#
#   Unlike OpenTX we fire on STATE CHANGE (false->true), matching the
#   arm-triggered recording in this player, rather than on "condition is true".
#
#   event <name>  when=<cond>  say=<clip,clip,...>  [repeat=<sec>]  [hyst=<n>]
#
# CONDITIONS
#   armed / !armed     the FC arm bit (MSP_STATUS) — the only structured value
#   <var> < <number>   true while var is below
#   <var> > <number>   true while var is above
#
# VARIABLES are read from the OSD DisplayPort stream, because a wire census
# showed msposd sends no MSP_ANALOG/MSP_BATTERY_STATE — only MSP_DISPLAYPORT,
# MSP_STATUS and MSP_FC_VARIANT ever arrive. Units are FONT SYMBOLS, not letters
# (0x06=volts, 0x07=mAh, 0x01=rssi), which is how each number is identified:
#   vbat  pack voltage      mah  consumed capacity
#   lq    link quality %    alt  altitude (m)
# A variable that is not on screen simply never fires — it is NOT read as 0.
#
# say= TOKENS
#   <word>   a clip in sounds/         e.g. battry, lowbat, warnng, volt1
#   #<var>   speak that variable's VALUE (sounds/num/NNNN.wav, 0..100)
#
# repeat=0  announce once each time the condition becomes true
# repeat=N  keep announcing every N seconds while it stays true
# hyst=X    deadband: must clear the threshold by X to re-arm, so a value
#           resting on the limit does not announce repeatedly

# --- arm state ------------------------------------------------------------
event arm             when=armed       say=armed                    repeat=0
event disarm          when=!armed      say=disarm                   repeat=0

# --- battery: several phrasings, pick per taste ---------------------------
# Spoken value:      "battery  fifteen  volts"
event batt_warn       when=vbat<15.0   say=battry,#vbat,volt1       repeat=20  hyst=0.2
# Plain warning:     "low battery"
event batt_low        when=vbat<14.5   say=lowbat                   repeat=12  hyst=0.2
# Urgent alert:      "battery alert" + "warning"
event batt_critical   when=vbat<14.0   say=batalert,warnng          repeat=6   hyst=0.2

# --- link quality ---------------------------------------------------------
# Spoken value:      "<n> percent"
event link_weak       when=lq<50       say=#lq,percent0             repeat=15  hyst=5
# EdgeTX's own RSSI clips
event link_low        when=lq<35       say=rssi_org                 repeat=10  hyst=5
event link_critical   when=lq<20       say=rssi_red,warnng          repeat=6   hyst=5
event telem_lost      when=lq<5        say=telemko                  repeat=8   hyst=3

# --- capacity used --------------------------------------------------------
event mah_warn        when=mah>1200    say=battry,warnng            repeat=30  hyst=25
